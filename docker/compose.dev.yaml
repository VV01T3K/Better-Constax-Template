services:
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        CONVEX_SITE_URL: ${CONVEX_SITE_URL}
        CONVEX_URL: ${CONVEX_URL}
    env_file:
      - ../.env.local
    environment:
      HOST: 0.0.0.0
      PORT: 8080
    ports:
      - "3000:8080"
    init: true
