services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
      target: runner
      args:
        - VITE_CONVEX_URL=${VITE_CONVEX_URL}
        - VITE_CONVEX_SITE_URL=${VITE_CONVEX_SITE_URL}
    ports:
      - "3001:8080"
    environment:
      - NODE_ENV=production
      - VITE_CONVEX_URL=${VITE_CONVEX_URL}
      - VITE_CONVEX_SITE_URL=${VITE_CONVEX_SITE_URL}
      - CONVEX_DEPLOYMENT=${CONVEX_DEPLOYMENT}
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "bun", "-e", "fetch('http://localhost:8080').then(r => r.status === 200 ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
